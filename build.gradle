plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.minecraftforge.gradle' version '7.0.31' apply false
    id 'net.minecraftforge.renamer' version '1.1.2' apply false
}

allprojects {
    group = 'me.vibing'
    version = mod_version

    repositories {
        mavenCentral()
    }
}

tasks.register('buildFabricLegacy', Exec) {
    workingDir = file('fabric-legacy')
    commandLine file('fabric-legacy/gradlew').absolutePath, 'clean', 'build', '--console=plain'
}

tasks.register('checkAll') {
    dependsOn(
            ':core:check',
            ':fabric:build', tasks.named('buildFabricLegacy'),
            ':forge:build', ':forge-legacy:build',
            ':neoforge:build', ':neoforge-legacy:build')
}
