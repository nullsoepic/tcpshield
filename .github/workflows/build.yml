name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build legacy Fabric
        run: |
          chmod +x fabric-legacy/gradlew
          ./fabric-legacy/gradlew -p fabric-legacy clean build --stacktrace

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean checkAll -PskipFabricLegacy --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tcpshield-artifacts
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            fabric-legacy/build/libs/*.jar
            forge/build/libs/*.jar
            forge-legacy/build/libs/*.jar
            neoforge/build/libs/*.jar
            neoforge-legacy/build/libs/*.jar
